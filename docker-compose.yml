# Florela: n8n (orquestração) + Postgres + serviço de agentes.
# O nome do projeto "florela" reaproveita os volumes já criados na instância.
name: florela

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"   # só local; acesso via túnel SSH até ligar o HTTPS
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_HOST: ${N8N_HOST:-localhost}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy

  agents:
    build: ./services/agents
    restart: unless-stopped
    # Sem porta publicada: só o n8n (rede interna do Docker) chama http://agents:3000
    environment:
      TZ: America/Sao_Paulo
      REPO_DIR: /app/repo
      DATA_DIR: /data
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-3}
      SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN:-}
      SHOPIFY_ADMIN_TOKEN: ${SHOPIFY_ADMIN_TOKEN:-}
      SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-2025-10}
      STORE_PUBLIC_URL: ${STORE_PUBLIC_URL:-https://www.florela.com.br}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_FALLBACKS: ${CLAUDE_FALLBACKS:-default}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      IG_USER_ID: ${IG_USER_ID:-}
      IG_ACCESS_TOKEN: ${IG_ACCESS_TOKEN:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      HIGGSFIELD_API_KEY: ${HIGGSFIELD_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-PedroReisgg/Florela-Bot}
      GITHUB_BASE_BRANCH: ${GITHUB_BASE_BRANCH:-claude/project-thread-58zlgu}
    volumes:
      - ./skills:/app/repo/skills:ro
      - ./context:/app/repo/context:ro
      - agents_data:/data

  # HTTPS para o n8n (DuckDNS). Ligue com: docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - n8n

volumes:
  pg_data:
  n8n_data:
  agents_data:
  caddy_data:
